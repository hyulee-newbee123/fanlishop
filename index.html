<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>追赶返利商店</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23c5161d'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <section id="gate" class="gate">
    <form id="gate-form" class="gate-card" autocomplete="off">
      <div class="seal" aria-hidden="true">券</div>
      <p class="eyebrow">冒险团商店</p>
      <h1>先写下你的点券</h1>
      <p class="lead">填好追赶返利点券，再进入商店。每件商品都能加减数量，花费会当场算清，而且不会花成负数。</p>
      <label for="asset">我的追赶返利点券</label>
      <div class="asset-field">
        <input id="asset" class="asset-input" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="例如 20000" />
        <span>点券</span>
      </div>
      <p id="gate-error" class="error" hidden></p>
      <button type="submit" id="enter" class="btn-primary" disabled>进入商店</button>
      <p class="fine">点券和已选数量记在这台浏览器里，刷新还在。</p>
    </form>
  </section>

  <div id="shop" hidden>
    <header class="mast">
      <div class="wrap mast-inner">
        <div class="brand">
          <div class="seal" aria-hidden="true">券</div>
          <div>
            <p class="eyebrow">冒险团 · 追赶返利点券</p>
            <h1>返利商店</h1>
          </div>
        </div>
        <button type="button" id="edit-asset" class="btn-ghost">修改资产</button>
      </div>
    </header>

    <div class="status" id="status">
      <div class="wrap status-inner">
        <div class="status-fig">
          <span>资产</span>
          <strong id="s-asset">0</strong>
        </div>
        <div class="status-fig">
          <span>本次花费</span>
          <strong id="s-spent">0</strong>
        </div>
        <div class="status-fig status-left" id="left-fig">
          <span>剩余</span>
          <strong id="s-left">0</strong>
        </div>
        <div class="status-progress">
          <div class="status-bar" aria-hidden="true"><i id="s-bar"></i></div>
          <span id="s-pct">已用 0%</span>
        </div>
        <div id="toast" class="toast" role="status" hidden>
          <span id="toast-text"></span>
          <button type="button" id="toast-undo" hidden>撤销</button>
        </div>
      </div>
    </div>

    <p id="live" class="sr-only" aria-live="polite"></p>

    <main class="wrap layout">
      <div class="catalog">
        <div class="filters">
          <div class="cats" id="cats"></div>
          <div class="tools">
            <input id="search" type="search" placeholder="搜索道具名称" autocomplete="off" spellcheck="false" />
            <button type="button" id="only-selected" aria-pressed="false">只看已选</button>
          </div>
        </div>
        <p class="fine">加减数量会马上重算花费，剩余点券不会小于 0。同名但单价不同的商品，限购各自计算。</p>
        <div class="sheet">
          <div class="list-head cols">
            <span>道具名称</span>
            <span>所需点券</span>
            <span>冒险团限购</span>
            <span>数量</span>
            <span>小计</span>
          </div>
          <div id="rows"></div>
        </div>
        <p id="list-empty" class="list-empty" hidden></p>
        <p id="list-count" class="list-count"></p>
      </div>

      <aside class="bill" id="bill">
        <details id="bill-details">
          <summary>
            <span>消费明细</span>
            <span id="bill-meta">未选择</span>
          </summary>
          <div id="bill-lines"></div>
          <div class="bill-foot">
            <div>
              <span>合计花费</span>
              <strong id="bill-total">0</strong>
            </div>
            <div>
              <span>剩余点券</span>
              <strong id="bill-left">0</strong>
            </div>
          </div>
          <button type="button" id="clear-btn" class="btn-ghost" disabled>清空已选</button>
        </details>
      </aside>
    </main>
  </div>

  <div id="modal" class="modal" hidden>
    <button type="button" class="backdrop" id="modal-backdrop" aria-label="关闭"></button>
    <form id="asset-form" class="modal-card" role="dialog" aria-modal="true" aria-labelledby="asset-title" autocomplete="off">
      <h2 id="asset-title">修改资产</h2>
      <p id="asset-help" class="lead"></p>
      <label for="asset-edit">追赶返利点券</label>
      <div class="asset-field asset-field-sm">
        <input id="asset-edit" inputmode="numeric" autocomplete="off" spellcheck="false" />
        <span>点券</span>
      </div>
      <p id="asset-error" class="error" hidden></p>
      <div class="modal-actions">
        <button type="submit" id="asset-save" class="btn-primary">保存</button>
        <button type="button" id="modal-clear" class="btn-ghost">清空已选</button>
        <button type="button" id="modal-cancel" class="btn-ghost">取消</button>
      </div>
    </form>
  </div>

  <script src="js/logic.js"></script>
  <script src="js/items.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
